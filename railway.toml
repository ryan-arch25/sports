# Railway config-as-code. Set ODDS_API_KEY and DASHBOARD_PASSWORD under
# Variables in the Railway dashboard; neither belongs in this file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Keep this at one. Each replica runs its own scan schedule, so two replicas
# means two sets of API requests against the same quota.
numReplicas = 1
