# Railway config-as-code. Set ODDS_API_KEY and DASHBOARD_PASSWORD under
# Variables in the Railway dashboard; neither belongs in this file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# If you attach a volume, set DATA_DIR to the same mount path. The image's
# entrypoint starts as root, takes ownership of that path for the app user and
# then drops privileges, so a root-owned mount is not a problem.
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Keep this at one. Each replica runs its own scan schedule, so two replicas
# means two sets of API requests against the same quota.
numReplicas = 1
